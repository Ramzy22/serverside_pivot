name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate-and-publish:
    name: Validate and Publish to PyPI
    runs-on: [self-hosted, pivot-release]
    environment: pypi-release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0" build twine

      - name: Add pivot-engine to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/dash_tanstack_pivot/pivot_engine" >> $GITHUB_ENV

      - name: Install serverside-pivot (editable)
        run: python -m pip install -e "dash_tanstack_pivot[dev,api,redis,streamlit,security]"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dash_tanstack_pivot

      - name: Build and validate Dash, React, and Streamlit hosts
        run: |
          npm run build
        working-directory: dash_tanstack_pivot

      - name: Verify bundle contract and budgets
        run: |
          python scripts/ci/verify_bundle_contract.py
          python scripts/ci/verify_host_build_contract.py --package-dir dash_tanstack_pivot

      - name: Gate release on complete installed qualification
        run: |
          PIVOT_RELEASE_QUALIFICATION_DIR="$RUNNER_TEMP/installed-release-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          echo "PIVOT_RELEASE_QUALIFICATION_DIR=$PIVOT_RELEASE_QUALIFICATION_DIR" >> "$GITHUB_ENV"
          python scripts/certify_flagship.py --installed-release --artifact-dir "$PIVOT_RELEASE_QUALIFICATION_DIR"

      - name: Upload complete installed qualification evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: release-installed-qualification-evidence
          path: ${{ env.PIVOT_RELEASE_QUALIFICATION_DIR }}/
          if-no-files-found: error

      - name: Pack and verify standalone React package
        run: |
          mkdir -p "$RUNNER_TEMP/serverside-pivot-npm"
          cp "$PIVOT_RELEASE_QUALIFICATION_DIR"/release-artifacts/*.tgz "$RUNNER_TEMP/serverside-pivot-npm/"
          python scripts/ci/verify_npm_package_contract.py "$RUNNER_TEMP/serverside-pivot-npm"/*.tgz

      - name: Validate tag/version parity
        run: python scripts/ci/check_tag_version.py

      - name: Run complete Python and browser-capability suite
        run: python -m pytest -q

      - name: Create security reports directory
        run: mkdir -p security/reports

      - name: Create dependency audit report
        run: |
          python scripts/ci/create_dependency_audit_inventory.py --project-root dash_tanstack_pivot --requirements security/reports/third-party-requirements.txt --provenance security/reports/first-party-provenance.json
          set +e
          pip-audit -r security/reports/third-party-requirements.txt --no-deps --disable-pip --strict --format json --output security/reports/pip-audit.json
          status=$?
          set -e
          test -s security/reports/pip-audit.json
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Create JavaScript dependency audit report
        working-directory: dash_tanstack_pivot
        run: |
          set +e
          npm audit --omit=dev --json > ../security/reports/npm-audit.json
          status=$?
          set -e
          test -s ../security/reports/npm-audit.json
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Create static security analysis report
        run: |
          set +e
          bandit -r dash_tanstack_pivot/pivot_engine/pivot_engine -f json -o security/reports/bandit.json
          status=$?
          set -e
          test -s security/reports/bandit.json
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file security/reports/sbom.cdx.json --output-format JSON

      - name: Verify protected production deployment edge
        env:
          PIVOT_RELEASE_DEPLOYMENT_ORIGIN: ${{ vars.PIVOT_RELEASE_DEPLOYMENT_ORIGIN }}
        run: |
          test -n "$PIVOT_RELEASE_DEPLOYMENT_ORIGIN"
          python scripts/verify_production_deployment.py --base-url "$PIVOT_RELEASE_DEPLOYMENT_ORIGIN" --output security/reports/deployment-security.json

      - name: Upload release security evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: release-security-evidence
          path: security/reports/
          if-no-files-found: error

      - name: Gate release on dependency findings
        run: python scripts/ci/verify_dependency_audit.py --audit security/reports/pip-audit.json --exceptions security/dependency-exceptions.json

      - name: Gate release on JavaScript dependency findings
        run: python scripts/ci/verify_npm_audit.py --audit security/reports/npm-audit.json

      - name: Gate release on static security findings
        run: bandit -r dash_tanstack_pivot/pivot_engine/pivot_engine

      - name: Require protected operator evidence
        env:
          PIVOT_RELEASE_EVIDENCE_PATH: ${{ vars.PIVOT_RELEASE_EVIDENCE_PATH }}
          PIVOT_RELEASE_ENVIRONMENT: ${{ vars.PIVOT_RELEASE_ENVIRONMENT }}
          PIVOT_RELEASE_DEPLOYMENT_ORIGIN: ${{ vars.PIVOT_RELEASE_DEPLOYMENT_ORIGIN }}
        run: |
          test -n "$PIVOT_RELEASE_EVIDENCE_PATH"
          test -n "$PIVOT_RELEASE_ENVIRONMENT"
          test -n "$PIVOT_RELEASE_DEPLOYMENT_ORIGIN"
          test "$PIVOT_RELEASE_EVIDENCE_PATH" != "security/release-evidence.example.json"
          test -f "$PIVOT_RELEASE_EVIDENCE_PATH"
          python scripts/verify_security_release_evidence.py --matrix security/certification-matrix.json --evidence "$PIVOT_RELEASE_EVIDENCE_PATH" --repository-root . --expected-tag "${GITHUB_REF_NAME}" --expected-commit "${GITHUB_SHA}" --expected-environment "$PIVOT_RELEASE_ENVIRONMENT" --expected-deployment-origin "$PIVOT_RELEASE_DEPLOYMENT_ORIGIN"

      - name: Stage qualified distribution
        run: |
          PIVOT_PYPI_DIST="$(mktemp -d .pypi-release.XXXXXX)"
          echo "PIVOT_PYPI_DIST=$PIVOT_PYPI_DIST" >> "$GITHUB_ENV"
          cp "$PIVOT_RELEASE_QUALIFICATION_DIR"/release-artifacts/wheels/*.whl "$PIVOT_PYPI_DIST/"

      - name: Validate artifacts with twine check
        run: twine check "$PIVOT_PYPI_DIST"/*.whl

      - name: Verify wheel package contract
        run: python scripts/ci/verify_wheel_contract.py "$PIVOT_PYPI_DIST"/*.whl

      - name: Install wheel in an isolated environment and execute runtime smoke
        run: |
          python -m venv "$RUNNER_TEMP/serverside-pivot-wheel-smoke"
          "$RUNNER_TEMP/serverside-pivot-wheel-smoke/bin/python" -m pip install --upgrade pip
          WHEEL="$(find "$PIVOT_PYPI_DIST" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          "$RUNNER_TEMP/serverside-pivot-wheel-smoke/bin/python" -m pip install "${WHEEL}[api,qualification]" httpx
          cd "$RUNNER_TEMP/serverside-pivot-wheel-smoke"
          "$RUNNER_TEMP/serverside-pivot-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/ci/smoke_installed_python_runtime.py"

      - name: Install packed React package and execute runtime transport
        run: |
          SMOKE_DIR="$RUNNER_TEMP/serverside-pivot-react-smoke"
          mkdir -p "$SMOKE_DIR"
          cp scripts/ci/smoke_installed_react_runtime.mjs "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          npm init --yes
          npm install --ignore-scripts "$RUNNER_TEMP/serverside-pivot-npm"/*.tgz
          node smoke_installed_react_runtime.mjs

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.PIVOT_PYPI_DIST }}/
