name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<71"
          python -m pip install duckdb pyarrow "ibis-framework[duckdb]" pandas fastapi "uvicorn[standard]" dash pytest tomli redis jsonschema "python-jose[cryptography]"

      - name: Add pivot-engine to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/dash_tanstack_pivot/pivot_engine" >> $GITHUB_ENV

      - name: Install serverside-pivot (editable)
        run: pip install -e dash_tanstack_pivot/

      - name: Run complete Python and browser-capability suite
        run: |
          python -m pytest -q

  js-build:
    name: JS Build and Bundle Contract
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dash_tanstack_pivot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python for build:py step
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install setuptools for build:py
        run: pip install "setuptools<71" dash

      - name: Build Dash, React, and Streamlit hosts
        run: npm run build

      - name: Verify bundle contract
        working-directory: ${{ github.workspace }}
        run: python scripts/ci/verify_bundle_contract.py

      - name: Verify React and Streamlit build contract
        working-directory: ${{ github.workspace }}
        run: python scripts/ci/verify_host_build_contract.py --package-dir dash_tanstack_pivot

      - name: Pack and verify standalone React package
        run: |
          mkdir -p "$RUNNER_TEMP/serverside-pivot-npm"
          npm pack --json --pack-destination "$RUNNER_TEMP/serverside-pivot-npm"
          python ../scripts/ci/verify_npm_package_contract.py "$RUNNER_TEMP/serverside-pivot-npm"/*.tgz

  package-smoke:
    name: Package Build and Import Smoke
    runs-on: ubuntu-latest
    needs: [python-tests, js-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build tools
        run: python -m pip install --upgrade pip "setuptools<71" build twine dash

      - name: Install frontend dependencies from clean checkout
        run: npm ci
        working-directory: dash_tanstack_pivot

      - name: Build every advertised host from clean checkout
        run: npm run build
        working-directory: dash_tanstack_pivot

      - name: Verify all host build outputs
        run: |
          python scripts/ci/verify_bundle_contract.py
          python scripts/ci/verify_host_build_contract.py --package-dir dash_tanstack_pivot

      - name: Pack and verify standalone React package
        run: |
          mkdir -p "$RUNNER_TEMP/serverside-pivot-npm"
          cd dash_tanstack_pivot
          npm pack --json --pack-destination "$RUNNER_TEMP/serverside-pivot-npm"
          cd ..
          python scripts/ci/verify_npm_package_contract.py "$RUNNER_TEMP/serverside-pivot-npm"/*.tgz

      - name: Build distribution
        run: python -m build dash_tanstack_pivot/

      - name: Check distribution metadata
        run: twine check dash_tanstack_pivot/dist/*

      - name: Verify wheel package contract
        run: python scripts/ci/verify_wheel_contract.py dash_tanstack_pivot/dist/*.whl

      - name: Install wheel in an isolated environment and execute runtime smoke
        run: |
          python -m venv "$RUNNER_TEMP/serverside-pivot-wheel-smoke"
          "$RUNNER_TEMP/serverside-pivot-wheel-smoke/bin/python" -m pip install --upgrade pip
          WHEEL="$(find "$GITHUB_WORKSPACE/dash_tanstack_pivot/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          "$RUNNER_TEMP/serverside-pivot-wheel-smoke/bin/python" -m pip install "${WHEEL}[api]" httpx
          cd "$RUNNER_TEMP/serverside-pivot-wheel-smoke"
          "$RUNNER_TEMP/serverside-pivot-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/ci/smoke_installed_python_runtime.py"

      - name: Install packed React package and execute runtime transport
        run: |
          SMOKE_DIR="$RUNNER_TEMP/serverside-pivot-react-smoke"
          mkdir -p "$SMOKE_DIR"
          cp scripts/ci/smoke_installed_react_runtime.mjs "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          npm init --yes
          npm install --ignore-scripts "$RUNNER_TEMP/serverside-pivot-npm"/*.tgz
          node smoke_installed_react_runtime.mjs
