name: Security evidence

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install application and pinned security tools
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install -r security/requirements-security.txt
          python -m pip install -e "serverside_pivot[dev,api,redis]"
      - name: Create reports directory
        run: mkdir -p security/reports
      - name: Dependency audit
        run: |
          python scripts/ci/create_dependency_audit_inventory.py --project-root serverside_pivot --requirements security/reports/third-party-requirements.txt --provenance security/reports/first-party-provenance.json
          set +e
          pip-audit -r security/reports/third-party-requirements.txt --no-deps --disable-pip --strict --format json --output security/reports/pip-audit.json
          status=$?
          set -e
          test -s security/reports/pip-audit.json
          test "$status" -eq 0 -o "$status" -eq 1
      - name: Verify reviewed dependency exceptions
        run: python scripts/ci/verify_dependency_audit.py --audit security/reports/pip-audit.json --exceptions security/dependency-exceptions.json
      - name: Install frontend dependencies
        working-directory: serverside_pivot
        run: npm ci
      - name: JavaScript dependency audit
        working-directory: serverside_pivot
        run: |
          set +e
          npm audit --omit=dev --json > ../security/reports/npm-audit.json
          status=$?
          set -e
          test -s ../security/reports/npm-audit.json
          test "$status" -eq 0 -o "$status" -eq 1
      - name: Verify JavaScript dependency audit
        run: python scripts/ci/verify_npm_audit.py --audit security/reports/npm-audit.json
      - name: Static security analysis
        run: bandit -r serverside_pivot/pivot_engine/pivot_engine -f json -o security/reports/bandit.json
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file security/reports/sbom.cdx.json --output-format JSON
      - name: Security regression suite
        run: |
          export PYTHONPATH="$PYTHONPATH:${{ github.workspace }}/serverside_pivot/pivot_engine"
          pytest -q tests/test_production_security.py tests/test_security_config.py tests/test_runtime_dataset_authorization.py tests/test_runtime_http_transport.py tests/test_legacy_tanstack_authorization.py tests/test_realtime_authorization.py
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: security-evidence
          path: security/reports/
          if-no-files-found: error
